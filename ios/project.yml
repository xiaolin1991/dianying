# 晓林影视 iOS 原生壳工程 (XcodeGen 规格)
# CI: brew install xcodegen && cd ios && xcodegen
# 免签构建: xcodebuild ... CODE_SIGNING_ALLOWED=NO
name: XiaoLinTV
options:
  bundleIdPrefix: com.xiaolintv
  deploymentTarget:
    iOS: "13.0"
targets:
  XiaoLinTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaolintv.app
        PRODUCT_NAME: XiaoLinTV
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"   # 1=iPhone 2=iPad (CI 分别覆盖)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        # 构建时可用 START_URL=https://你的域名/ 覆盖
        START_URL: "https://your-worker.your-subdomain.workers.dev/"
