# ============================================================
# 晓林影视 XIAOLIN-TV — Cloudflare Workers 部署配置
# 用法:
#   1. npm install          (安装 wrangler)
#   2. 创建 D1 数据库: npx wrangler d1 create dianying
#      创建 KV 存储:   npx wrangler kv namespace create dianying_KV
#      把输出的 database_id 和 namespace id 填到下方配置中
#   3. npm run deploy
# ============================================================
name = "xiaolin-tv"
main = "_worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# /api/* 与 /APP/* 先进入 Worker（APP 可在静态资源过期时从 GitHub 拉最新包）
run_worker_first = ["/api/*", "/APP/*"]

# ============================================================
# D1 关系型数据库绑定 (核心主存储，高性能 SQL 存储)
# 数据库名: dianying，绑定名: dianying (代码同时兼容 dianying 与 DB)
# ============================================================
[[d1_databases]]
binding = "dianying"
database_name = "dianying"
database_id = "9641ac16-a43d-423a-af0f-501fd6705d4c"        # ← 必填: 替换为您创建的 dianying D1 数据库 ID

# ============================================================
# KV 命名空间绑定 (保留双写备份 / 容灾降级)
# 命名空间名: dianying_KV，绑定名: dianying_KV (代码同时兼容 dianying_KV 与 CONFIG_KV)
# ============================================================
# [[kv_namespaces]]
# binding = "dianying_KV"
# id = "YOUR_KV_NAMESPACE_ID"               # ← 必填: 替换为您创建的 dianying_KV 命名空间 ID (若继续使用旧空间可填旧 ID)

[vars]
# 后台管理密码(强烈建议修改; 也可在 Dashboard → Worker → 设置 → 环境变量 里配置为加密变量)
ADMIN_PASSWORD = "admin123"
# 初始成人内容开关(后台可随时切换): "false" 关闭 / "true" 开启
ADULT_ENABLED = "false"
# 影视源配置地址(LunaTV-config 每日自动更新)
CONFIG_URL = "https://raw.githubusercontent.com/hafrey1/LunaTV-config/main/LunaTV-config.json"
# 私有仓同步 APK 版本用（密钥 GITHUB_TOKEN 在 Dashboard 配置，勿写进仓库）
GITHUB_REPO = "xiaolin1991/dianying"
