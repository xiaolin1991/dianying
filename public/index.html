<!-- 关键内联防崩兜底样式：彻底杜绝机顶盒偶发网络抖动时出现图五的白屏巨型图标或巨型SVG圆圈 -->

</style>
<link rel="stylesheet" href="./css/themes.css?v=20261017v16">
<!-- 改动 js/css 后必须递增 v= 版本号, 否则手机浏览器/APK WebView 会一直用旧缓存 -->
<link rel="stylesheet" href="./css/app.css?v=20261017v16">

<!-- 非阻塞异步加载 HLS.js + 国内高速 CDN 自动容灾，绝不阻塞机顶盒/电视端首屏加载 -->
<script src="https://s4.zstatic.net/ajax/libs/hls.js/1.5.15/hls.min.js" async defer onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js';s.async=true;document.head.appendChild(s);})()"></script>

<body class="ui-modern" data-mtheme="light">
<script>
/* 首屏 0ms 瞬时挂载用户记忆的日间/夜间模式与网站版式，并彻底清理旧版遗留的 ntv:tvMode 电脑端污染 */
(function(){
  try {
    localStorage.removeItem('ntv:tvMode');
    sessionStorage.removeItem('ntv_tv_override');
  } catch (e) {}
  try {
    var rawMode = localStorage.getItem('ntv:userColorMode') || localStorage.getItem('ntv:uiModernTheme');
    var mode = rawMode ? JSON.parse(rawMode) : 'light';
    if (mode !== 'dark') mode = 'light';
    document.body.setAttribute('data-mtheme', mode);
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', mode === 'light' ? '#f3f6fb' : '#090d16');

    var rawLayout = localStorage.getItem('ntv:uiLayout');
    var layout = rawLayout ? JSON.parse(rawLayout) : 'modern';
    document.body.classList.toggle('ui-modern', layout !== 'classic');
  } catch (e) {
    document.body.setAttribute('data-mtheme', 'light');
    document.body.classList.add('ui-modern');
  }
})();
</script>
