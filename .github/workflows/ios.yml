# 晓林影视 iOS 免签 IPA 构建 (iPhone + iPad)
# 触发: GitHub Actions 页面手动 Run workflow (与安卓一致, 确认网页正常后再构建)
# 产物: 未签名 IPA → 可用 TrollStore / AltStore / SideStore / Sideloadly(自签7天) 安装
name: 'Build iOS IPA'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '已确认网页版浏览与功能均正常？(输入 yes 确认构建)'
        required: true
        default: 'yes'
      changelog:
        description: '本次构建更新说明(选填)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App icon from public/icons/icon-512.png
        run: |
          sips -z 1024 1024 public/icons/icon-512.png \
            --out ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: |
          cd ios && xcodegen
          ls -la

      - name: Build unsigned .app (iPhone+iPad 通用)
        env:
          START_URL: ${{ vars.START_URL }}
        run: |
          set -o pipefail
          cd ios
          ARGS="MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [ -n "$START_URL" ]; then ARGS="$ARGS START_URL=$START_URL"; fi
          xcodebuild -project XiaoLinTV.xcodeproj -scheme XiaoLinTV \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $ARGS build 2>&1 | tee ../ios-build-log.txt

      - name: Package IPA (通用 + iPad 专用)
        run: |
          APP=$(find ios/build -type d -name "XiaoLinTV.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::未找到 XiaoLinTV.app 构建产物"
            find ios/build -maxdepth 5 | head -50
            exit 1
          fi
          echo "APP = $APP"
          mkdir -p out
          # 通用包 (iPhone + iPad)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "out/晓林影视-ios-免签-v1.0.${{ github.run_number }}.ipa" Payload
          cp "out/晓林影视-ios-免签-v1.0.${{ github.run_number }}.ipa" "out/晓林影视-ios-免签-latest.ipa"
          # iPad 专用包(仅 iPad 家族)
          plutil -replace UIDeviceFamily -json '[2]' Payload/XiaoLinTV.app/Info.plist 2>/dev/null || true
          rm -f Payload/XiaoLinTV.app/_CodeSignature 2>/dev/null || true
          zip -qr "out/晓林影视-ipad-免签-v1.0.${{ github.run_number }}.ipa" Payload
          rm -rf Payload
          ls -la out

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build-log.txt
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Collect changelog
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'ios-v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" | head -20 || true)
          else
            LOG=$(git log --pretty=format:'- %s (%h)' -8 || true)
          fi
          {
            echo 'LOG<<CHANGELOG_EOF'
            echo "${LOG:-（首次发布）}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish iOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: 晓林影视 iOS 免签版 v1.0.${{ github.run_number }}
          body: |
            ## 晓林影视 iOS 免签 IPA v1.0.${{ github.run_number }}

            自动构建 · commit `${{ github.sha }}`

            ### 安装方式 (任选其一)
            - **TrollStore (巨魔)**: 直接安装, 永久有效
            - **AltStore / SideStore**: 自签安装, 7 天续签
            - **Sideloadly / 爱思助手**: 电脑自签安装

            ### 说明
            - `晓林影视-ios-免签-*`: iPhone / iPad 通用
            - `晓林影视-ipad-免签-*`: iPad 专用
            - 未签名包, 需自行签名或巨魔安装; 视频全屏可横屏铺满, 不受系统旋转锁定影响

            ### 本次更新
            ${{ steps.notes.outputs.LOG }}
          files: out/*.ipa
