name: Android APK

# 每次 push 到 main 自动打包调试版 APK; 也可在 Actions 页手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 可选: 在仓库 Settings → Secrets and variables → Actions → Variables 里
      # 添加变量 START_URL = https://你的域名/ , APK 将自动装载该地址
      - name: Build Debug APK
        env:
          START_URL: ${{ vars.START_URL }}
        run: |
          ARGS=""
          if [ -n "$START_URL" ]; then
            ARGS="-PstartUrl=$START_URL"
          fi
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS 2>&1 | tee build-log.txt

      # 无论成败都保存完整构建日志, 失败时直接下载看 "What went wrong" 全文
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XIAOLIN-TV-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
