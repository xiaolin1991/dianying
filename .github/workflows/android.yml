name: Build & Publish (APK + Docker)

# 每次 push 到 main: ① 打包 APK → public/APP + Releases ② 构建 Docker 镜像发布到 GHCR
# public/APP 的回写提交不会再触发本工作流(paths-ignore + [skip ci])
# 注意: 仓库首页绿勾里的「Workers Builds」是 Cloudflare，不是本工作流；请到 Actions 页查看本任务
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'public/APP/**'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: write   # Release 上传 + 回写 public/APP
  packages: write   # GHCR 镜像推送

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 完整历史+标签: 用于生成版本号与「距上一版」的更新日志
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 可选: 在仓库 Settings → Secrets and variables → Actions → Variables 里
      # 添加变量 START_URL = https://你的域名/ , APK 将自动装载该地址
      # 版本号自动递增: v1.0.<构建编号>
      - name: Build Debug APK
        env:
          START_URL: ${{ vars.START_URL }}
          RUN_NO: ${{ github.run_number }}
        run: |
          ARGS="-PverCode=$RUN_NO -PverName=1.0.$RUN_NO"
          if [ -n "$START_URL" ]; then
            ARGS="$ARGS -PstartUrl=$START_URL"
          fi
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS 2>&1 | tee build-log.txt

      # 无论成败都保存完整构建日志, 失败时直接下载看 "What went wrong" 全文
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Rename APK (phone + TV)
        run: |
          mkdir -p out
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-v1.0.${{ github.run_number }}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-v1.0.${{ github.run_number }}.apk"
          # 固定文件名副本: 网站下载按钮可永远指向同一个直链
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-latest.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-latest.apk"
          ls -la out

      # 写入工作区 public/APP（供本 job 后续使用）；版本信息写入 manifest.json
      - name: Publish APK to public/APP
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          NOTES=$(git log --pretty=format:'- %s' -8 | head -20)
          node scripts/publish-apk.mjs \
            --apk "android/app/build/outputs/apk/debug/app-debug.apk" \
            --code "$RUN_NO" \
            --name "1.0.$RUN_NO" \
            --changelog "$NOTES"

      # 不写 main（避免与本地开发推送互相挡住）；APK 推到独立分支 publish/app
      - name: Push APP to publish/app branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          STAGE=/tmp/apppub-$RUN_NO
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -a public/APP/. "$STAGE/"
          WORK=/tmp/appbranch-$RUN_NO
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          git init -b publish/app
          mkdir -p public/APP
          cp -a "$STAGE"/. public/APP/
          git add public/APP
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(app): APK v1.0.${RUN_NO}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin publish/app
          echo "published to branch publish/app (main unchanged)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-apk
          path: out/*.apk
          if-no-files-found: error

      # 每次构建发布为独立版本号 Release(v1.0.<构建号>) —— 历史版本全部保留可回滚;
      # GitHub 会自动把最新创建的 Release 标记为 Latest 置顶展示。
      # 固定文件名副本(xiaolintv-*-latest.apk)保证网站下载直链永远指向当前最新版。
      - name: Collect changelog since previous release
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" | head -20)
          else
            LOG=$(git log --pretty=format:'- %s (%h)' -8)
          fi
          {
            echo 'LOG<<CHANGELOG_EOF'
            echo "${LOG:-（首次发布）}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 晓林影视 v1.0.${{ github.run_number }}
          body: |
            ## 📦 晓林影视 v1.0.${{ github.run_number }}

            自动构建 · commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) · 构建 #${{ github.run_number }}

            ### 📥 安装说明

            📱 **安卓手机**: 优先从你的站点下载 `/APP/xiaolintv-phone-latest.apk`（国内直链）
            📺 **电视/盒子**: `/APP/xiaolintv-tv-latest.apk`（同一通用包）
            🍎 **iPhone/iPad**: 无需下载！Safari 打开网站 → 分享 → **添加到主屏幕**(PWA)
            🐳 **Docker**: `docker pull ghcr.io/${{ github.repository }}:latest`

            > 🔗 站点永久最新直链：\`{你的域名}/APP/xiaolintv-phone-latest.apk\`
            > 🕘 本 Release 附件为备份（私有仓国内可能需代理）

            ### 📝 本次更新内容
            ${{ steps.notes.outputs.LOG }}
          files: out/*.apk
          make_latest: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: repo
        name: Lowercase image name
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
