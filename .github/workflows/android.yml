# 一键构建全平台 App（安卓 APK + iOS 免签 IPA + Docker 镜像）并发布统一 Release：
# 默认推送到 main 分支不会盲目打包，先部署并确认网页版浏览正常无误后，再确认触发构建：
# 方式 1: GitHub Actions 页面点击 "Run workflow"，输入 yes 确认触发
# 方式 2: 后台管理中心「APP推广 / App 版本更新」点击「🚀 确认网页正常，立即触发构建 APK」
# 方式 3: 确认版本后推送版本标签触发（例如 git tag v1.0.77 && git push origin v1.0.77）
# 打包完成后 publish-release job 会把 APK + iPhone/iPad IPA 合并到同一个 Release，并自动删除历史旧版本
name: 'Build APP (APK + iOS IPA + Docker)'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '已确认网页版浏览与功能均正常？(输入 yes 确认构建)'
        required: true
        default: 'yes'
      changelog:
        description: '本次构建更新说明(选填)'
        required: false
        default: ''

concurrency:
  group: apk-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已预装 Android SDK (含 licenses), 无需 setup-android
      # (setup-android@v3 会执行 sdkmanager tools, 新版 cmdline-tools 16.0 已移除 tools 包导致失败)
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate launcher icons from public/icons/icon-512.png
        run: |
          # ubuntu-latest(24.04) 已不再预装 ImageMagick, 先安装
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          SRC="public/icons/icon-512.png"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            convert "$SRC" -resize "${2}x${2}" "android/app/src/main/res/mipmap-$1/ic_launcher.png"
          done
          # 电视横幅 320x180(居中裁剪)
          convert "$SRC" -resize "320x180^" -gravity center -extent 320x180 "android/app/src/main/res/drawable/banner.png"
          echo "icons regenerated from $SRC"

      - name: Build Debug APK (Phone + Dedicated TV APK)
        env:
          START_URL: ${{ vars.START_URL }}
          RUN_NO: ${{ github.run_number }}
        run: |
          ARGS="-PverCode=$RUN_NO -PverName=1.0.$RUN_NO"
          if [ -n "$START_URL" ]; then
            ARGS="$ARGS -PstartUrl=$START_URL"
          fi
          set -o pipefail
          mkdir -p out
          # 1. 构建手机版 APK (isTvApk=false)
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS -PisTvApk=false 2>&1 | tee build-log.txt
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-v1.0.${RUN_NO}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-latest.apk"
          # 2. 构建电视/盒子专用版 APK (isTvApk=true, 强制横屏 + 腾讯TV极光大屏UI)
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS -PisTvApk=true 2>&1 | tee -a build-log.txt
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-v1.0.${RUN_NO}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-latest.apk"
          ls -la out

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Publish APK to public/APP
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RAW=$(git log --pretty=format:'%s' "${PREV}..HEAD" || true)
          else
            RAW=$(git log --pretty=format:'%s' -15 || true)
          fi
          NOTES=$(printf '%s\n' "$RAW" | grep -vE '^(chore\(app\)|ci:|Merge |自动|fix: stop CI)' | head -12 | sed 's/^/- /' || true)
          if [ -z "$NOTES" ]; then
            NOTES="- 版本更新至 1.0.${RUN_NO}"$'\n'"- 优化体验与稳定性"
          fi
          CUSTOM_LOG="${{ github.event.inputs.changelog }}"
          if [ -n "$CUSTOM_LOG" ]; then
            NOTES="晓林影视 1.0.${RUN_NO}"$'\n'"${CUSTOM_LOG}"
          else
            NOTES="晓林影视 1.0.${RUN_NO}"$'\n'"${NOTES}"
          fi
          node scripts/publish-apk.mjs \
            --apk "out/xiaolintv-phone-latest.apk" \
            --tv-apk "out/xiaolintv-tv-latest.apk" \
            --code "$RUN_NO" \
            --name "1.0.$RUN_NO" \
            --changelog "$NOTES"

      - name: Generate iPhone/iPad 免签名描述文件 (.mobileconfig)
        env:
          START_URL: ${{ vars.START_URL }}
        run: |
          node scripts/gen-mobileconfig.mjs
          mkdir -p out
          if [ -f public/APP/xiaolintv-ios-latest.mobileconfig ]; then
            cp public/APP/xiaolintv-ios-latest.mobileconfig "out/晓林影视-描述文件-免签名.mobileconfig"
          fi
          ls -la out

      # public/APP 的提交与推送统一放到 publish-release job（避免两个 job 并发抢推 main 互相覆盖）

      # 可选 Secret：CF_DEPLOY_HOOK（不要写在 if: 里，secrets 不能用于 if，会导致整份工作流校验失败）
      - name: Trigger Cloudflare deploy hook
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "未配置 CF_DEPLOY_HOOK，跳过"
            exit 0
          fi
          code=$(curl -sS -o /tmp/cf-hook.out -w "%{http_code}" -X POST "$CF_DEPLOY_HOOK" || echo "000")
          echo "deploy hook HTTP $code"
          head -c 400 /tmp/cf-hook.out 2>/dev/null || true
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::warning::Cloudflare Deploy Hook 未成功（$code），请检查 Secret CF_DEPLOY_HOOK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-apk
          path: out/*
          if-no-files-found: error


  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - id: repo
        name: Lowercase image name
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ipa:
    name: Build iOS IPA (unsigned)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App icon from public/icons/icon-512.png
        run: |
          sips -z 1024 1024 public/icons/icon-512.png \
            --out ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: cd ios && xcodegen

      - name: Build unsigned .app (iPhone+iPad 通用)
        env:
          START_URL: ${{ vars.START_URL }}
        run: |
          set -o pipefail
          cd ios
          ARGS="MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }}"
          if [ -n "$START_URL" ]; then ARGS="$ARGS START_URL=$START_URL"; fi
          xcodebuild -project XiaoLinTV.xcodeproj -scheme XiaoLinTV \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $ARGS build 2>&1 | tee ../ios-build-log.txt

      - name: Package IPA (通用 + iPad 专用)
        run: |
          APP=$(find ios/build -type d -name "XiaoLinTV.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::未找到 XiaoLinTV.app 构建产物"
            find ios/build -maxdepth 5 | head -50
            exit 1
          fi
          echo "APP = $APP"
          mkdir -p out
          # 通用包 (iPhone + iPad)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "out/晓林影视-ios-免签-v1.0.${{ github.run_number }}.ipa" Payload
          cp "out/晓林影视-ios-免签-v1.0.${{ github.run_number }}.ipa" "out/xiaolintv-ios-latest.ipa"
          # iPad 专用包(仅 iPad 家族)
          plutil -replace UIDeviceFamily -json '[2]' Payload/XiaoLinTV.app/Info.plist 2>/dev/null || true
          zip -qr "out/晓林影视-ipad-免签-v1.0.${{ github.run_number }}.ipa" Payload
          cp "out/晓林影视-ipad-免签-v1.0.${{ github.run_number }}.ipa" "out/xiaolintv-ipad-latest.ipa"
          rm -rf Payload
          ls -la out

      # IPA 写入 public/APP 与推送统一由 publish-release job 完成（避免与 APK job 并发抢推）

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build-log.txt
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-ipa
          path: out/*.ipa
          if-no-files-found: error

  publish-release:
    name: Publish unified Release (APK + IPA)
    runs-on: ubuntu-latest
    needs: [build-apk, build-ipa]
    # APK 成功即可发布（iOS 构建失败时只缺 IPA，不影响安卓发布）
    if: ${{ always() && needs.build-apk.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xiaolintv-*
          path: out
          merge-multiple: true

      - name: Verify artifacts (手机APK/电视APK 必须, IPA 可选)
        run: |
          set -e
          MISSING=0
          for f in xiaolintv-phone-latest.apk xiaolintv-tv-latest.apk; do
            if [ -f "out/$f" ]; then
              echo "✅ $f  $(du -h "out/$f" | cut -f1)"
            else
              echo "::error::缺少关键构建产物: $f"
              MISSING=1
            fi
          done
          for f in xiaolintv-ios-latest.ipa xiaolintv-ipad-latest.ipa; do
            if [ -f "out/$f" ]; then
              echo "✅ $f  $(du -h "out/$f" | cut -f1)"
            else
              echo "::warning::本次缺少 $f（iOS 构建失败或被跳过，仅影响 iOS 包）"
            fi
          done
          ls -la out
          if [ "$MISSING" = "1" ]; then echo "关键产物不完整, 终止发布"; exit 1; fi
          if cmp -s out/xiaolintv-phone-latest.apk out/xiaolintv-tv-latest.apk; then
            echo "ℹ️ 手机版与电视版为同一通用 APK（当前设计如此，两个文件名都发布）"
          else
            echo "ℹ️ 手机版与电视版为两个不同的 APK"
          fi

      - name: Assemble public/APP (APK + IPA + 描述文件 + manifest.json)
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          mkdir -p public/APP
          cp "out/xiaolintv-phone-latest.apk" "public/APP/xiaolintv-phone-latest.apk"
          cp "out/xiaolintv-tv-latest.apk" "public/APP/xiaolintv-tv-latest.apk"
          cp "out/xiaolintv-phone-v1.0.${RUN_NO}.apk" "public/APP/xiaolintv-phone-v1.0.${RUN_NO}.apk" 2>/dev/null || true
          cp "out/xiaolintv-tv-v1.0.${RUN_NO}.apk" "public/APP/xiaolintv-tv-v1.0.${RUN_NO}.apk" 2>/dev/null || true
          cp "out/xiaolintv-ios-latest.ipa" "public/APP/xiaolintv-ios-latest.ipa" 2>/dev/null || echo "::warning::无 iOS IPA, 跳过"
          cp "out/xiaolintv-ipad-latest.ipa" "public/APP/xiaolintv-ipad-latest.ipa" 2>/dev/null || true
          if [ -f "out/晓林影视-描述文件-免签名.mobileconfig" ]; then
            cp "out/晓林影视-描述文件-免签名.mobileconfig" "public/APP/xiaolintv-ios-latest.mobileconfig"
          elif [ -f "public/APP/xiaolintv-ios-latest.mobileconfig" ]; then
            echo "ℹ️ 复用仓库中已有的描述文件"
          fi
          # 清理历史旧版 APK, 只保留本次最新版
          find public/APP -maxdepth 1 -name 'xiaolintv-phone-v*.apk' ! -name "xiaolintv-phone-v1.0.${RUN_NO}.apk" -delete 2>/dev/null || true
          find public/APP -maxdepth 1 -name 'xiaolintv-tv-v*.apk' ! -name "xiaolintv-tv-v1.0.${RUN_NO}.apk" -delete 2>/dev/null || true
          node -e "
            const fs=require('fs');
            const p='public/APP/manifest.json';
            const m=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
            m.versionCode=Number('${RUN_NO}');
            m.versionName='1.0.'+m.versionCode;
            m.publishedAt=new Date().toISOString();
            m.phone={path:'/APP/xiaolintv-phone-latest.apk',versioned:'/APP/xiaolintv-phone-v1.0.${RUN_NO}.apk'};
            m.tv={path:'/APP/xiaolintv-tv-latest.apk',versioned:'/APP/xiaolintv-tv-v1.0.${RUN_NO}.apk'};
            m.ios = fs.existsSync('public/APP/xiaolintv-ios-latest.ipa')
              ? {path:'/APP/xiaolintv-ios-latest.ipa',profile:'/APP/xiaolintv-ios-latest.mobileconfig'}
              : {profile:'/APP/xiaolintv-ios-latest.mobileconfig'};
            if (fs.existsSync('public/APP/xiaolintv-ipad-latest.ipa')) {
              m.ipad={path:'/APP/xiaolintv-ipad-latest.ipa'};
            }
            fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');
            console.log('manifest.json versionCode =', m.versionCode);
          "
          ls -la public/APP

      - name: Push public/APP to main (唯一推送入口, 失败即报错)
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/APP
          if git diff --cached --quiet; then
            echo "No APP changes"
            exit 0
          fi
          git commit -m "chore(app): sync APK+IPA v1.0.${RUN_NO}"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "✅ 已同步 public/APP 到 main"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push rejected, retry $i"
            sleep 5
          done
          echo "::error::无法推送 public/APP 到 main（站点将拿不到最新安装包，请检查仓库权限/分支保护）"
          exit 1

      - name: Sync publish/app branch (服务器/NAS 拉取用)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          WORK=/tmp/appbranch-$RUN_NO
          rm -rf "$WORK" && mkdir -p "$WORK/public/APP"
          cp -a public/APP/. "$WORK/public/APP/"
          cd "$WORK"
          git init -q -b publish/app
          git add public/APP
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(app): APP v1.0.${RUN_NO}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin publish/app
          echo "✅ 已同步 publish/app 分支"

      - name: Delete old Releases (仅保留本次最新版)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CUR="v1.0.${{ github.run_number }}"
          echo "current tag: $CUR"
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            if [ "$t" = "$CUR" ]; then continue; fi
            echo "deleting old release: $t"
            gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Collect changelog since previous release
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" | head -20 || true)
          else
            LOG=$(git log --pretty=format:'- %s (%h)' -8 || true)
          fi
          {
            echo 'LOG<<CHANGELOG_EOF'
            echo "${LOG:-（首次发布）}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish unified Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 晓林影视 v1.0.${{ github.run_number }}
          body: |
            ## 晓林影视 v1.0.${{ github.run_number }}

            自动构建 · commit `${{ github.sha }}` · 构建 #${{ github.run_number }}
            （历史旧版本已自动清理，仅保留本次最新版）

            ### 📥 下载清单
            | 平台 | 文件 | 站内固定地址 |
            |---|---|---|
            | 安卓手机 | xiaolintv-phone-v1.0.${{ github.run_number }}.apk | `/APP/xiaolintv-phone-latest.apk` |
            | 电视/盒子 | xiaolintv-tv-v1.0.${{ github.run_number }}.apk | `/APP/xiaolintv-tv-latest.apk` |
            | iPhone/iPad 免签 | 晓林影视-ios-免签-v1.0.${{ github.run_number }}.ipa | `/APP/xiaolintv-ios-latest.ipa` |
            | iPhone/iPad 描述文件 | 晓林影视-描述文件-免签名.mobileconfig | `/APP/xiaolintv-ios-latest.mobileconfig` |
            | iPad 专用免签 | 晓林影视-ipad-免签-v1.0.${{ github.run_number }}.ipa | `/APP/xiaolintv-ipad-latest.ipa` |

            ### 🍎 iOS 免签安装方式 (任选其一)
            - **TrollStore (巨魔)**: 直接安装, 永久有效
            - **AltStore / SideStore**: 自签安装, 7 天续签
            - **Sideloadly / 爱思助手**: 电脑自签安装

            ### 本次更新
            ${{ steps.notes.outputs.LOG }}
          files: out/*
          make_latest: true

