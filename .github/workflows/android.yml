name: Build & Publish (APK + Docker)

# 每次 push 到 main: ① 打包 APK 发布到 Releases ② 构建 Docker 镜像发布到 GHCR
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # Release 上传
  packages: write   # GHCR 镜像推送

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 可选: 在仓库 Settings → Secrets and variables → Actions → Variables 里
      # 添加变量 START_URL = https://你的域名/ , APK 将自动装载该地址
      # 版本号自动递增: v1.0.<构建编号>
      - name: Build Debug APK
        env:
          START_URL: ${{ vars.START_URL }}
          RUN_NO: ${{ github.run_number }}
        run: |
          ARGS="-PverCode=$RUN_NO -PverName=1.0.$RUN_NO"
          if [ -n "$START_URL" ]; then
            ARGS="$ARGS -PstartUrl=$START_URL"
          fi
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS 2>&1 | tee build-log.txt

      # 无论成败都保存完整构建日志, 失败时直接下载看 "What went wrong" 全文
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Rename APK (phone + TV)
        run: |
          mkdir -p out
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-v1.0.${{ github.run_number }}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-v1.0.${{ github.run_number }}.apk"
          # 固定文件名副本: 网站下载按钮可永远指向同一个直链
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-latest.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-latest.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-apk
          path: out/*.apk
          if-no-files-found: error

      # 发布/更新 latest Release(每次构建覆盖附件), 手机/电视直接从 Releases 下载安装
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 晓林影视 最新版 (v1.0.${{ github.run_number }})
          body: |
            自动构建 · commit ${{ github.sha }} · build #${{ github.run_number }}

            📱 **安卓手机**: 下载 `xiaolintv-phone-v*.apk` 安装（首次允许「未知来源」）
            📺 **电视/盒子**: 下载 `xiaolintv-tv-v*.apk`（同一通用包, 已带 TV 启动器, 遥控器可操作）
            🍎 **iPhone/iPad**: 无需下载! 用 Safari 打开网站 → 分享 → **添加到主屏幕**, 即得全屏 App 图标(PWA)
            🐳 **Docker**: `docker pull ghcr.io/${{ github.repository }}:latest`（部署教程见仓库 docs/DEPLOY-VPS.md，宝塔面板看 docs/DEPLOY-BT.md）
            当前版本 **v1.0.${{ github.run_number }}**
          files: out/*.apk
          make_latest: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: repo
        name: Lowercase image name
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
