name: Build & Publish (APK + Docker)

# 每次 push 到 main：打包 APK + 发布 Releases + 构建 Docker 推 GHCR
# 机器人回写 APK 的提交带 [skip ci]，不会再次触发
# 仓库首页的「Workers Builds」是 Cloudflare，不是本工作流 → 请看 Actions 页本任务
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: apk-docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

# 跳过规则：仅当提交说明里带「skip ci」方括号标记时，由 GitHub 原生跳过整次 workflow
# （机器人回写 public/APP 的提交会带该标记；普通功能提交说明正文不要写这个标记，否则 Actions 整次不跑）
jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Debug APK
        env:
          START_URL: ${{ vars.START_URL }}
          RUN_NO: ${{ github.run_number }}
        run: |
          ARGS="-PverCode=$RUN_NO -PverName=1.0.$RUN_NO"
          if [ -n "$START_URL" ]; then
            ARGS="$ARGS -PstartUrl=$START_URL"
          fi
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace $ARGS 2>&1 | tee build-log.txt

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Rename APK (phone + TV)
        run: |
          mkdir -p out
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-v1.0.${{ github.run_number }}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-v1.0.${{ github.run_number }}.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-phone-latest.apk"
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "out/xiaolintv-tv-latest.apk"
          ls -la out

      - name: Publish APK to public/APP
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RUN_NO: ${{ github.run_number }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RAW=$(git log --pretty=format:'%s' "${PREV}..HEAD" || true)
          else
            RAW=$(git log --pretty=format:'%s' -15 || true)
          fi
          NOTES=$(printf '%s\n' "$RAW" | grep -vE '^(chore\(app\)|ci:|Merge |自动|fix: stop CI)' | head -12 | sed 's/^/- /' || true)
          if [ -z "$NOTES" ]; then
            NOTES="- 版本更新至 1.0.${RUN_NO}"$'\n'"- 优化体验与稳定性"
          fi
          NOTES="晓林影视 1.0.${RUN_NO}"$'\n'"${NOTES}"
          node scripts/publish-apk.mjs \
            --apk "android/app/build/outputs/apk/debug/app-debug.apk" \
            --code "$RUN_NO" \
            --name "1.0.$RUN_NO" \
            --changelog "$NOTES"

      - name: Push APP to publish/app branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          STAGE=/tmp/apppub-$RUN_NO
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -a public/APP/. "$STAGE/"
          WORK=/tmp/appbranch-$RUN_NO
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          git init -b publish/app
          mkdir -p public/APP
          cp -a "$STAGE"/. public/APP/
          git add public/APP
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(app): APK v1.0.${RUN_NO}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin publish/app
          echo "published to branch publish/app"

      - name: Sync public/APP onto main
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/APP
          if git diff --cached --quiet; then
            echo "No APP changes"
            exit 0
          fi
          git commit -m "chore(app): sync APK v1.0.${RUN_NO} to main [skip ci]"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "synced APP to main"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push rejected, retry $i"
            sleep 4
          done
          echo "::warning::未能推送到 main，请服务器执行 sync-app-branch 或稍后重试"
          exit 0

      # Cloudflare Workers：bot 提交带 [skip ci] 时，若 Build watch paths 排除了 public/APP，线上不会更新。
      # 在仓库 Secrets 添加 CF_DEPLOY_HOOK = Cloudflare Deploy Hook URL，打包后强制重建。
      - name: Trigger Cloudflare deploy hook
        if: ${{ secrets.CF_DEPLOY_HOOK }}
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          code=$(curl -sS -o /tmp/cf-hook.out -w "%{http_code}" -X POST "$CF_DEPLOY_HOOK" || echo "000")
          echo "deploy hook HTTP $code"
          head -c 400 /tmp/cf-hook.out 2>/dev/null || true
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::warning::Cloudflare Deploy Hook 未成功（$code），请检查 Secret CF_DEPLOY_HOOK"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaolintv-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Collect changelog since previous release
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v1.0.*' 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD" | head -20 || true)
          else
            LOG=$(git log --pretty=format:'- %s (%h)' -8 || true)
          fi
          {
            echo 'LOG<<CHANGELOG_EOF'
            echo "${LOG:-（首次发布）}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 晓林影视 v1.0.${{ github.run_number }}
          body: |
            ## 晓林影视 v1.0.${{ github.run_number }}

            自动构建 · commit `${{ github.sha }}` · 构建 #${{ github.run_number }}

            ### 安装说明
            - 安卓手机: 站点 `/APP/xiaolintv-phone-latest.apk`
            - 电视/盒子: `/APP/xiaolintv-tv-latest.apk`
            - Docker: `docker pull ghcr.io/${{ github.repository }}:latest`

            ### 本次更新
            ${{ steps.notes.outputs.LOG }}
          files: out/*.apk
          make_latest: true

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: repo
        name: Lowercase image name
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:v1.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
