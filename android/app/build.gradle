plugins {
    id 'com.android.application'
}

android {
    namespace 'com.XIAOLIN-TV.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.XIAOLIN-TV.app'
        minSdk 24          // 覆盖 Android 7.0+, 约98%设备
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // 启动地址: 构建时可用 -PstartUrl=https://你的域名/ 覆盖
        def su = project.findProperty('startUrl') ?: 'https://your-worker.your-subdomain.workers.dev/'
        buildConfigField 'String', 'START_URL', "\"${su}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
